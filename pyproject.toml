[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pychain"
version = "0.1.0"
description = "A Bitcoin-like educational blockchain implementation in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ecdsa>=0.19.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["run_api"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "appdb*",
    "auth*",
    "wallet*",
    "blockchain*",
    "consensus*",
    "crypto*",
    "mining*",
    "network*",
    "storage*",
    "transaction*",
]
exclude = [
    "tests*",
    "docs*",
    "data*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
appdb = ["schema.sql"]
